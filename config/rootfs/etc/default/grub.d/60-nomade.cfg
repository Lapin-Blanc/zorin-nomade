# zorin-nomade (SPEC E-11) : menu visible brièvement, pour pouvoir choisir le mode de
# dépannage sur une machine inconnue. Ne touche pas aux réglages de GRUB_CMDLINE_*.
GRUB_TIMEOUT_STYLE=menu
GRUB_TIMEOUT=3
GRUB_RECORDFAIL_TIMEOUT=5

# zorin-nomade (SPEC E-41) : sous Ubuntu, os-prober s'exécute si cette variable n'est pas définie.
# Il sonderait les disques de la VM de build (au build) puis ceux du PC hôte (à chaque update-grub)
# et ajouterait leurs systèmes au menu de la clé.
GRUB_DISABLE_OS_PROBER=true
