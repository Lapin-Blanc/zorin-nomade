# zorin-nomade — réactivité sur clé USB (SPEC E-19)
# La clé n'est jamais arrachée à chaud : on laisse la RAM absorber les écritures et le noyau
# les vider par paquets. Plafonds en octets pour que les vidages restent courts.
vm.dirty_background_bytes = 268435456
vm.dirty_bytes = 1073741824
vm.dirty_expire_centisecs = 6000
vm.dirty_writeback_centisecs = 1500

# Échange sur zram uniquement : on préfère compresser en RAM plutôt que vider le cache.
vm.swappiness = 180
vm.page-cluster = 0
