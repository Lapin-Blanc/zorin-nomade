# Lint et garde-fous à chaque push (SPEC E-42) : « make ci ». La construction complète et les
# tests QEMU sont dans image.yml ; le déploiement ne tourne jamais en CI.
name: lint
on:
  push:
  pull_request:
jobs:
  shellcheck:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck make
      - run: make ci
