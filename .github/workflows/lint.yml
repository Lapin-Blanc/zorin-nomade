# CI légère : lint des scripts. Le build complet et les tests QEMU restent locaux
# (ISO de plusieurs Gio, root dans une VM, KVM). À aligner en phase 4 sur la CI du projet Debian.
name: lint
on:
  push:
  pull_request:
jobs:
  shellcheck:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y shellcheck make
      - run: make ci
